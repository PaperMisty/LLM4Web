<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM4Web AI 助手设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <img src="icons/icon-48.png" alt="Logo" class="logo-img">
        <h1 class="title">AI Assistant Settings</h1>
      </div>
      <p class="subtitle">配置您的 API 提供商、密钥和模型，支持流式渲染与思考过程展示</p>
    </header>

    <main class="settings-card">
      <!-- 快捷导入面板 -->
      <div id="env-banner" class="env-banner hidden">
        <div class="env-banner-text">
          <span class="sparkle">✨</span>
          <span>检测到本地 <code>.env</code> 测试文件，可一键导入配置！</span>
        </div>
        <button id="btn-import-env" class="btn-secondary">一键导入</button>
      </div>

      <form id="settings-form">
        <!-- 呈现模式 -->
        <div class="form-group">
          <label for="display-mode">呈现方式 (Display Mode)</label>
          <div class="select-wrapper">
            <select id="display-mode" required>
              <option value="popup">悬浮小窗口 (Popup Window)</option>
              <option value="sidePanel">侧边栏模式 (Side Panel)</option>
              <option value="inPage">页面内悬浮面板 (Floating Overlay)</option>
            </select>
          </div>
        </div>

        <!-- 尺寸设置 -->
        <div class="form-group" id="window-size-group">
          <label>悬浮窗口尺寸自定义</label>
          <div class="modern-size-container">
            <!-- 宽度调节卡片 -->
            <div class="size-card">
              <div class="size-card-header">
                <span class="size-card-title">📐 窗口宽度</span>
                <span class="size-card-value">
                  <input type="number" id="window-width" min="200" max="2000" required>
                  <span class="unit">px</span>
                </span>
              </div>
              <div class="slider-wrapper">
                <input type="range" id="window-width-range" min="200" max="2000" class="modern-slider">
              </div>
            </div>
            
            <!-- 高度调节卡片 -->
            <div class="size-card">
              <div class="size-card-header">
                <span class="size-card-title">📏 窗口高度</span>
                <span class="size-card-value">
                  <input type="number" id="window-height" min="200" max="2000" required>
                  <span class="unit">px</span>
                </span>
              </div>
              <div class="slider-wrapper">
                <input type="range" id="window-height-range" min="200" max="2000" class="modern-slider">
              </div>
            </div>
          </div>
          <span class="help-text" id="window-size-hint">设置悬浮小窗口或页面内悬浮面板的尺寸大小。</span>
        </div>

        <!-- 窗口关闭策略 -->
        <div class="form-group" id="close-strategy-group">
          <label for="close-strategy">小窗口关闭方式 (Close Strategy)</label>
          <div class="select-wrapper">
            <select id="close-strategy" required>
              <option value="manual">主动关闭才关闭 (默认)</option>
              <option value="blur">点击其他网页空白处自动关闭</option>
            </select>
          </div>
          <span class="help-text hidden" id="close-strategy-hint">页面内悬浮面板是网页内的一层，不依赖窗口焦点，该设置不生效。</span>
        </div>

        <!-- 配色主题 -->
        <div class="form-group">
          <label for="theme-select">界面配色方案 (Theme)</label>
          <div class="select-wrapper">
            <select id="theme-select" required>
              <option value="warm-amber">🌼 柔和暖米淡黄 (默认护眼)</option>
              <option value="silver-white">🌪️ 极简质感银白</option>
              <option value="cyber-cyan">🌐 极光数码科技青</option>
              <option value="lavender-purple">🔮 浪漫薰衣草紫</option>
              <option value="forest-green">🌲 优雅深林黛绿</option>
              <option value="classic-dark">🎱 经典深邃磨砂黑</option>
            </select>
          </div>
        </div>

        <!-- 接口提供商 -->
        <div class="form-group">
          <label for="provider">API 提供商</label>
          <div class="select-wrapper">
            <select id="provider" required>
              <option value="siliconflow">硅基流动 (SiliconFlow)</option>
              <option value="deepseek">DeepSeek 官方</option>
              <option value="custom">自定义 (Custom OpenAI-compatible)</option>
            </select>
          </div>
        </div>

        <!-- Base URL -->
        <div class="form-group">
          <label for="base-url">API Base URL</label>
          <input type="url" id="base-url" placeholder="https://api.siliconflow.cn/v1" required>
        </div>

        <!-- API Key -->
        <div class="form-group">
          <label for="api-key">API Key (密钥)</label>
          <div class="input-password-wrapper">
            <input type="password" id="api-key" placeholder="输入您的 API Key" required>
            <button type="button" id="toggle-password" class="password-toggle-btn" title="显示/隐藏">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Model -->
        <div class="form-group">
          <label for="model-select">模型 (Model Name)</label>
          <div class="input-suggest-wrapper" style="display: flex; flex-direction: column; gap: 8px;">
            <input type="text" id="model-search" placeholder="🔍 输入关键字过滤模型列表..." style="margin-bottom: 4px;">
            <select id="model-select" required>
              <!-- 动态根据 Provider 插入，且最末包含“自定义输入...”项 -->
            </select>
            <input type="text" id="model-custom" class="hidden" placeholder="请输入自定义模型名称，例如 deepseek-v4-pro" required>
          </div>
          <div class="model-action-buttons">
            <button type="button" id="btn-fetch-models" class="btn-secondary-action" title="拉取当前配置下服务商提供的所有模型">
              <span>🔄 拉取可用模型</span>
              <div class="spinner-sm hidden"></div>
            </button>
            <button type="button" id="btn-test-model" class="btn-secondary-action" title="发送 1 token 测试连通性并自动探测推理(Thinking)支持状态">
              <span>🔌 测试连接与推理</span>
              <div class="spinner-sm hidden"></div>
            </button>
          </div>
          <span class="help-text">拉取最新模型可以更新下拉菜单；测试连接能够自动探测当前模型是否支持推理模式（Thinking）。</span>
        </div>

        <!-- 提交区域 -->
        <div class="form-actions">
          <button type="submit" id="btn-save" class="btn-primary">
            <span>保存配置</span>
            <div class="spinner hidden"></div>
          </button>
        </div>
      </form>
    </main>

    <!-- 浮动提示通知 -->
    <div id="toast" class="toast hidden"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
